<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Pixel-art space invader / martian in cyan -->
  <!-- Row 1: antennae -->
  <rect x="3" y="0" width="1" height="1" fill="#06B6D4"/>
  <rect x="12" y="0" width="1" height="1" fill="#06B6D4"/>
  <!-- Row 2: antennae lower -->
  <rect x="4" y="1" width="1" height="1" fill="#06B6D4"/>
  <rect x="11" y="1" width="1" height="1" fill="#06B6D4"/>
  <!-- Row 3: top of head -->
  <rect x="5" y="2" width="6" height="1" fill="#06B6D4"/>
  <!-- Row 4: head wider -->
  <rect x="4" y="3" width="8" height="1" fill="#06B6D4"/>
  <!-- Row 5: eyes row -->
  <rect x="3" y="4" width="10" height="1" fill="#06B6D4"/>
  <rect x="5" y="4" width="2" height="1" fill="#09090b"/>
  <rect x="9" y="4" width="2" height="1" fill="#09090b"/>
  <!-- Row 6: face -->
  <rect x="3" y="5" width="10" height="1" fill="#06B6D4"/>
  <!-- Row 7: mouth -->
  <rect x="3" y="6" width="10" height="1" fill="#06B6D4"/>
  <rect x="6" y="6" width="4" height="1" fill="#0E7490"/>
  <!-- Row 8: body top -->
  <rect x="2" y="7" width="12" height="1" fill="#06B6D4"/>
  <!-- Row 9: body -->
  <rect x="2" y="8" width="12" height="1" fill="#06B6D4"/>
  <!-- Row 10: body with cutouts -->
  <rect x="2" y="9" width="3" height="1" fill="#06B6D4"/>
  <rect x="7" y="9" width="2" height="1" fill="#06B6D4"/>
  <rect x="11" y="9" width="3" height="1" fill="#06B6D4"/>
  <!-- Row 11: arms out -->
  <rect x="1" y="10" width="3" height="1" fill="#06B6D4"/>
  <rect x="6" y="10" width="4" height="1" fill="#06B6D4"/>
  <rect x="12" y="10" width="3" height="1" fill="#06B6D4"/>
  <!-- Row 12: legs start -->
  <rect x="4" y="11" width="2" height="1" fill="#06B6D4"/>
  <rect x="10" y="11" width="2" height="1" fill="#06B6D4"/>
  <!-- Row 13: feet -->
  <rect x="3" y="12" width="2" height="1" fill="#06B6D4"/>
  <rect x="11" y="12" width="2" height="1" fill="#06B6D4"/>
</svg>
