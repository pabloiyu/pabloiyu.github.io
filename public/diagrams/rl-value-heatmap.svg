<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <style>
    text { font-family: 'Inter', sans-serif; fill: #a1a1aa; }
    .label { font-size: 13px; font-weight: 600; fill: #d4d4d8; }
  </style>

  <!-- Title -->
  <text class="label" x="150" y="24" text-anchor="middle">Value Function V(s)</text>

  <!-- 5x5 grid of cells with varying opacity to show value landscape -->
  <!-- Row 0 (top - low value, far from goal) -->
  <rect x="30" y="40" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.05" stroke="#52525b" stroke-width="1"/>
  <rect x="82" y="40" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.07" stroke="#52525b" stroke-width="1"/>
  <rect x="134" y="40" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.08" stroke="#52525b" stroke-width="1"/>
  <rect x="186" y="40" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.06" stroke="#52525b" stroke-width="1"/>
  <rect x="238" y="40" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.04" stroke="#52525b" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="30" y="92" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.08" stroke="#52525b" stroke-width="1"/>
  <rect x="82" y="92" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.12" stroke="#52525b" stroke-width="1"/>
  <rect x="134" y="92" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.18" stroke="#52525b" stroke-width="1"/>
  <rect x="186" y="92" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.14" stroke="#52525b" stroke-width="1"/>
  <rect x="238" y="92" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.10" stroke="#52525b" stroke-width="1"/>

  <!-- Row 2 -->
  <rect x="30" y="144" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.10" stroke="#52525b" stroke-width="1"/>
  <rect x="82" y="144" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.20" stroke="#52525b" stroke-width="1"/>
  <rect x="134" y="144" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.35" stroke="#52525b" stroke-width="1"/>
  <rect x="186" y="144" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.28" stroke="#52525b" stroke-width="1"/>
  <rect x="238" y="144" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.22" stroke="#52525b" stroke-width="1"/>

  <!-- Row 3 -->
  <rect x="30" y="196" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.12" stroke="#52525b" stroke-width="1"/>
  <rect x="82" y="196" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.30" stroke="#52525b" stroke-width="1"/>
  <rect x="134" y="196" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.50" stroke="#52525b" stroke-width="1"/>
  <rect x="186" y="196" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.65" stroke="#52525b" stroke-width="1"/>
  <rect x="238" y="196" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.45" stroke="#52525b" stroke-width="1"/>

  <!-- Row 4 (bottom-right is goal - highest value) -->
  <rect x="30" y="248" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.08" stroke="#52525b" stroke-width="1"/>
  <rect x="82" y="248" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.25" stroke="#52525b" stroke-width="1"/>
  <rect x="134" y="248" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.45" stroke="#52525b" stroke-width="1"/>
  <rect x="186" y="248" width="48" height="48" rx="4" fill="#06B6D4" opacity="0.75" stroke="#52525b" stroke-width="1"/>
  <rect x="238" y="248" width="48" height="48" rx="4" fill="#06B6D4" opacity="1.0" stroke="#06B6D4" stroke-width="2"/>

  <!-- Goal marker -->
  <text x="262" y="278" text-anchor="middle" font-size="16" fill="#06B6D4">G</text>

  <!-- Agent marker -->
  <circle cx="54" cy="64" r="8" fill="#06B6D4" opacity="0.9"/>
  <text x="54" y="68" text-anchor="middle" font-size="10" fill="#09090b" font-weight="600">A</text>

  <!-- Arrow showing gradient direction -->
  <path d="M80 80 L240 240" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4" opacity="0.3" marker-end="url(#valArrow)"/>
  <defs>
    <marker id="valArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#06B6D4" opacity="0.4"/>
    </marker>
  </defs>
</svg>
